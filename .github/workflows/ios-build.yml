name: Build iOS IPA

# Manual only — Apple builds burn macOS runner minutes and need signing
# secrets, so this doesn't run on every push. Trigger it from the Actions
# tab ("Run workflow") whenever you need a fresh .ipa.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   IOS_DIST_CERT_P12_BASE64       base64 of your Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD         password the .p12 was exported with
#   IOS_PROVISION_PROFILE_BASE64   base64 of the .mobileprovision file
#   IOS_TEAM_ID                    10-character Apple Developer Team ID
#   IOS_PROVISIONING_PROFILE_NAME  the profile's Name (Xcode → profile list),
#                                  not its filename
# Optional secrets (only needed to auto-upload to TestFlight):
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
#   APPSTORE_API_KEY_BASE64        base64 of the AuthKey_XXXX.p8 file
#
# How to get the base64 values (run locally on a Mac, or use `base64 -i`):
#   base64 -i Distribution.p12 | pbcopy
#   base64 -i Profile.mobileprovision | pbcopy
#   base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy
# Paste the copied text as the secret's value (GitHub secrets have no size
# issue with this — base64 of a cert/profile is a few KB at most).

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
      upload_to_testflight:
        description: 'Upload to TestFlight after building (app-store method only)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: maxvolt-hr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: maxvolt-hr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx vite build

      - name: Sync into iOS native project
        run: npx cap sync ios

      - name: Import signing certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          # macOS's base64 is BSD-style — it takes -D to decode, not GNU's
          # --decode (which errors out silently on this runner).
          echo -n "$CERT_P12_BASE64" | base64 -D -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -e
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Write ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.maxvolt.hr</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxvolt-one-ipa
          path: maxvolt-hr/build/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight == true && inputs.export_method == 'app-store' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_API_KEY_BASE64" | base64 -D -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          IPA_PATH=$(ls build/ipa/*.ipa | head -n1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
