[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
mountPath = "/app/uploads"

[[volumes]]
mountPath = "/app/data"

# The /root/.ollama volume moved to ollama-service/railway.toml along with
# Ollama itself — it no longer runs in this container.
